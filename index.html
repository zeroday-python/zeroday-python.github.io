<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>학생 정보</title>
    <style>
        table {
            border-collapse: collapse;
            width: 800px;
        }

        th, td {
            border: 1px solid #333;
            padding: 8px;
            text-align: center;
        }

        th {
            background-color: #f2f2f2;
        }

        .missing {
            color: red;
            font-weight: bold;
        }

        .outlier {
            background-color: #ffe5e5;
        }
    </style>
</head>
<body>

            </tr>

            </tr>
            <tr>
                <td>박민수</td>
                <td class="missing">결측치</td>
                <td>950720-1234567</td>
            </tr>
            <tr>

</body>
</html>
